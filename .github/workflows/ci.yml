name: CI

on:
  push:
    branches: [ "master", "feature/*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate-images:
    runs-on: ubuntu-latest
    environment: bazaar-env
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate Docker image versions
        run: |
          images=$(grep -oP '(?<=image: ).*' docker-compose.yml \
            | grep -v ':latest' \
            | grep -v 'matidocker990/')

          failed=0
          while IFS= read -r image; do
            echo "Checking: $image"
            if docker manifest inspect "$image" > /dev/null 2>&1; then
              echo "✅ OK: $image"
            else
              echo "❌ NOT FOUND: $image"
              failed=1
            fi
          done <<< "$images"

          exit $failed

  build:
    needs: validate-images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        include-prerelease: true

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: bazaar-env

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker images
      env:
        SA_PASSWORD: dummy
        JWT_KEY: dummy
        SERVICE_JWT_KEY: dummy
      run: docker compose build

    - name: Push Docker images
      env:
        SA_PASSWORD: dummy
        JWT_KEY: dummy
        SERVICE_JWT_KEY: dummy
      run: docker compose push

  deploy:
    runs-on: self-hosted
    needs: docker-build-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: bazaar-env

    steps:
    - uses: actions/checkout@v4

    - name: Deploy
      env:
        SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
        JWT_KEY: ${{ secrets.JWT_KEY }}
        SERVICE_JWT_KEY: ${{ secrets.SERVICE_JWT_KEY }}
      run: |
        mkdir -p /app/bazaar
        rm -rf /app/bazaar/loki-config.yaml /app/bazaar/promtail-config.yaml /app/bazaar/prometheus-config.yaml
        cp docker-compose.yml installation.sh /app/bazaar/
        cp loki-config.yaml promtail-config.yaml prometheus-config.yaml /app/bazaar/
        cp -r Database/ /app/bazaar/
        cd /app/bazaar
        cat > .env << EOF
        SA_PASSWORD=${SA_PASSWORD}
        JWT_KEY=${JWT_KEY}
        SERVICE_JWT_KEY=${SERVICE_JWT_KEY}
        EOF
        chmod u+x installation.sh
        source .env
        docker compose pull
        ./installation.sh "$SA_PASSWORD"
